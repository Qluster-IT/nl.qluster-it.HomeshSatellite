<!doctype html>
<html>

<head>

	<script type="text/javascript" src="/homey.js" data-origin="settings"></script>
	<script type="text/javascript" src="../assets/js/angular.js"></script>
	<script type="text/javascript" src="../assets/js/lodash.js"></script>
	<script type="text/javascript" src="../assets/js/smart-table.min.js"></script>
	<script type="text/javascript" src="/manager/webserver/assets/js/jquery.js"></script>
	
	<link rel="stylesheet" href="../assets/fontawesome/fontawesome.css" type="text/css"/>
	<link rel="stylesheet" href="../assets/css/default.css" type="text/css"/>

</head>

<body ng-app="homeshsatellite" ng-controller="homeshsatelliteCtrl as homeshsatellite">
<form name="mainForm">
	<div class="field">
		<div class="field margin-bottom">
			The pincode is used only during pairing and will give the Homesh Controller your token.
		</div>
		<div class="label">Pincode: </div>
		<input class="value" type="text" max="9999" min="0000" step="1" pattern="[0-9]{4}" maxlength="4" minlength="4" ng-model="vars.pincode"/>

		<button class="field" ng-click="mainForm.$valid && vars.pincode ? updatePincode() : null" ng-disabled="!mainForm.$valid || !vars.pincode">Update pincode</div>
	</div>
	<div class="field margin-top">		
		<div class="field margin-bottom">
			Generating a new Token will require you to repair and reconnected your Controller.
		</div>
		<div class="field">Token:</div>
		<div class="field break-all" ng-bind="vars.token"></div>
		<button class="field" ng-click="generateNewToken()" >Generate a new Token</div>
	</div>

	
	<!-- <div class="field margin-top">		
		<div class="field">Show Disabled Flows in the Lists:</div>
		<input class="checkbox " type="checkbox" ng-model="vars.showDisabledFlownames" ng-change="setShowDisabledFlownames()"/>
	</div> -->

</form>

<div id="overlay"></div>
	<script type="text/javascript">

		angular.module('homeshsatellite', ['smart-table'])
			.controller("homeshsatelliteCtrl", ['$scope', '$rootScope', '$timeout', '$compile', '$q', function ($scope, $rootScope, $timeout, $compile, $q) {
				//let $;
				var Homey;
				const vars = $scope.vars = {pincode:undefined, token:undefined};
				$scope.stamp = Date.now();


				$scope.$on('ready', function ($e, Homey_) {
					let promises = [];
					
					Homey = Homey_;
					$scope.__ = Homey.__;
					promises.push(get('pincode', (pincode)=> vars.pincode=pincode));
					promises.push(get('token', (token)=> vars.token=token));
					// promises.push(get('showDisabledFlownames', (showDisabledFlownames)=> vars.showDisabledFlownames=showDisabledFlownames));

					Homey.on('settings.set', (key, val)=> {
						switch (key) {
							case "token":
								get('token', (token)=> vars.token=token)
								break;
						}

					})

					Promise.all(promises)
					.then(()=>{})
					.catch((err)=>{						
						return Homey.alert(err);
					})
					.finally(()=>{						
						Homey.ready();
					})
					
				
				});

				$scope.updatePincode = function() {
					Homey.set('pincode', vars.pincode.toString() );
				}

				$scope.generateNewToken = function() {
					Homey.set('token', null );
				}

				// $scope.setShowDisabledFlownames = function() {
				// 	Homey.set('showDisabledFlownames', vars.showDisabledFlownames );
				// }

				async function get(settingKey, fc) {
					let defer = $q.defer();
					Homey.get(settingKey, (err, val)=> {
						if(err) {
							defer.reject(err);
							return Homey.alert(err);
						}
						$scope.$apply(()=> {
							if(fc) fc(val);
							defer.resolve(val);
						});
					})
					return defer.promise;
				}

			}])			
			.directive('ngEnter', function () {
				return function (scope, element, attrs) {
					element.bind('keydown keypress', function (event) {
						if (event.which === 13) {
							scope.$apply(function () {
								scope.$eval(attrs.ngEnter || attrs.ngClick, {
									$event: event
								});
							});
							event.preventDefault();
						}
					});
				};
			})
			.directive('tooltip', function ($compile) {
				var contentContainer;
				return {
					restrict: "A",
					scope: {
						myTooltipScope: "="
					},
					link: function (scope, element, attrs) {
						var text = attrs.tooltip;

						scope.hidden = true;

						var tooltipElement = angular.element("<div ng-hide='hidden' class='tooltip'>");
						tooltipElement.append("<div>" + text.replaceAll('\r\n', '<br/>') + "</div>");

						element.parent().append(tooltipElement);
						element
							.on('mouseenter', function () { scope.hidden = false; scope.$digest(); })
							.on('mouseleave', function () { scope.hidden = true; scope.$digest(); });

						var toolTipScope = scope.$new(true);
						angular.extend(toolTipScope, scope.myTooltipScope);
						$compile(tooltipElement.contents())(toolTipScope);
						$compile(tooltipElement)(scope);
					}
				};
			});

		function onHomeyReady(Homey) {
			console.log('onHomeyReady');
			var scope = angular.element(document.body).scope();
			scope.$emit('ready', Homey, $);//, $);
		}
	</script>
</body>

</html>
